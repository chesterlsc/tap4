name = "tapfour-platform"
main = "src/index.js"
compatibility_date = "2025-09-01"

# The live theme's assets (theme.css, fonts, product photos) are served as-is: one design source.
assets = { directory = "../assets" }

# Inline the theme's icon sprite from snippets/icon-sprite.liquid.
rules = [{ type = "Text", globs = ["**/*.liquid"], fallthrough = true }]

# Backup address that works even while a network's DNS still has stale tap4.ph answers.
workers_dev = true

# Live on tap4.ph (nameservers on Cloudflare since 2026-09-26). Custom domains create their own DNS records + certificates.
routes = [
  { pattern = "go.tap4.ph", custom_domain = true },
  { pattern = "admin.tap4.ph", custom_domain = true },
  { pattern = "dashboard.tap4.ph", custom_domain = true }
]

[vars]
# Permanent domain burned into every chip and QR. Never change it once chips are written.
# tap4.ph itself is the Vercel site, so taps live on a subdomain pointed at this Worker.
TAP_BASE = "https://go.tap4.ph"
# Staff dashboard: only /admin is served here, and the other hosts 404 /admin.
ADMIN_HOST = "admin.tap4.ph"
# Owners' dashboard: only /app is served here, and the other hosts 404 /app.
APP_HOST = "dashboard.tap4.ph"
# Backup host serving /admin and /app together (the workers.dev address). Password login still applies.
PREVIEW_HOST = "tapfour-platform.chesterlsc.workers.dev"
# Where a bare visit to "/" on go.tap4.ph goes (the Vercel site).
SITE_URL = "https://tap4.ph"
# Secret, set via `wrangler secret put HASH_SECRET`: salts the daily visitor hash.

[[d1_databases]]
binding = "DB"
database_name = "tapfour"
database_id = "866f21ca-48bd-48dd-8428-f8a63e4dc059"
migrations_dir = "migrations"

[observability]
enabled = true
